<div class="modal fade" id="mRetificar" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered"><form class="modal-content" method="post" data-modal-form>
    <input type="hidden" name="csrf_token" value="{{ csrf }}"><input type="hidden" name="next" value="">
    <div class="modal-header flex-column align-items-start">
      <div class="modal-icon"><i class="bi bi-pencil-square"></i></div>
      <h2 class="modal-title">Retificar evento</h2>
      <p class="text-muted small mb-0">Eventos são imutáveis: a correção vira um novo registro ligado ao original. <strong data-text="alvo"></strong></p>
    </div>
    <div class="modal-body">
      <div class="mb-3"><label class="form-label" for="mr_desc">O que está sendo corrigido<span class="req">*</span></label>
        <textarea class="form-control" id="mr_desc" name="descricao" rows="4" required minlength="3" maxlength="10000" placeholder="Descreva a informação correta…"></textarea></div>
      <div><label class="form-label" for="mr_titulo">Título <span class="text-muted fw-normal">(opcional)</span></label>
        <input class="form-control" id="mr_titulo" name="titulo" maxlength="200" placeholder="Padrão: Retificação: &lt;título original&gt;"></div>
    </div>
    <div class="modal-footer"><button type="button" class="btn btn-outline" data-bs-dismiss="modal">Cancelar</button><button type="submit" class="btn btn-primary"><i class="bi bi-check2"></i> Registrar retificação</button></div>
  </form></div>
</div>
